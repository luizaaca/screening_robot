[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screening-robot-agent"
version = "0.1.0"
description = "Stateful clinical screening assistant built with LangGraph and local or OpenAI-compatible clinical backends."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.8.4",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-openrouter>=0.1.0",
    "langgraph>=1.0.0",
    "openai>=2.32.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
