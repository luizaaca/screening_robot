[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screening-robot-agent"
version = "0.1.0"
description = "Stateful clinical screening assistant built with LangGraph and local or OpenAI-compatible clinical backends."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.11.1",
    "langchain>=1.2.15",
    "langchain-openai>=1.2.1",
    "langchain-openrouter>=0.2.1",
    "langgraph>=1.1.10",
    "jsonschema>=4.26.0",
    "openai>=2.32.0",
    "pydantic>=2.13.2",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]
video = [
    "deepface",
    "tf-keras",
    "opencv-python",
    "moviepy",
    "openai-whisper",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
